<svg color="#ffffff" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 686 300" role="img" aria-labelledby="title desc">
  <title id="title">暗号化と復号の流れ</title>
  <desc id="desc">平文を鍵で暗号文に変換し、暗号文を同じ鍵で平文に戻す流れを示す図。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 24 14" markerWidth="24" markerHeight="14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L24 7 L0 14 Z" fill="#ffffff" />
    </marker>
  </defs>
  <rect x="1" y="1" width="684" height="298" rx="18" fill="none" stroke="#ffffff" stroke-width="1" />
  <text x="343" y="36" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff">暗号化と復号の基本構造</text>

  <g font-family="sans-serif" fill="#ffffff">
    <text x="20" y="66" font-size="18" font-weight="700">暗号化</text>
    <text x="20" y="188" font-size="18" font-weight="700">復号</text>
  </g>

  <g fill="none" stroke="#ffffff">
    <rect x="20" y="80" width="150" height="78" rx="10" />
    <rect x="248" y="76" width="190" height="86" rx="10" />
    <rect x="516" y="80" width="150" height="78" rx="10" />

    <rect x="20" y="202" width="150" height="78" rx="10" />
    <rect x="248" y="198" width="190" height="86" rx="10" />
    <rect x="516" y="202" width="150" height="78" rx="10" />
  </g>

  <g font-family="sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="95" y="112" font-size="19" font-weight="700">平文</text>
    <text x="343" y="109" font-size="18" font-weight="700">暗号化</text>
    <text x="591" y="112" font-size="19" font-weight="700">暗号文</text>

    <text x="95" y="234" font-size="19" font-weight="700">暗号文</text>
    <text x="343" y="231" font-size="18" font-weight="700">復号</text>
    <text x="591" y="234" font-size="19" font-weight="700">平文</text>

    <text x="206" y="147" font-size="15">鍵 K</text>
    <text x="477" y="147" font-size="15">暗号文 C</text>
    <text x="206" y="269" font-size="15">鍵 K</text>
    <text x="477" y="269" font-size="15">平文 P</text>
  </g>

  <g font-family="serif" fill="#ffffff" text-anchor="middle">
    <text x="95" y="139" font-size="26">P</text>
    <text x="343" y="139" font-size="24">C = E<tspan baseline-shift="sub" font-size="15">K</tspan>(P)</text>
    <text x="591" y="139" font-size="26">C</text>

    <text x="95" y="261" font-size="26">C</text>
    <text x="343" y="261" font-size="24">P = D<tspan baseline-shift="sub" font-size="15">K</tspan>(C)</text>
    <text x="591" y="261" font-size="26">P</text>
  </g>

  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)">
    <line x1="178" y1="119" x2="216" y2="119" />
    <line x1="446" y1="119" x2="484" y2="119" />
    <line x1="178" y1="241" x2="216" y2="241" />
    <line x1="446" y1="241" x2="484" y2="241" />
  </g>
</svg>
