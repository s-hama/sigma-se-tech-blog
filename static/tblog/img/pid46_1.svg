<svg viewBox="-100 0 500 300" preserveAspectRatio="xMidYMid meet"
     xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto;">
  <style>
    text, foreignObject div {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
                   "Noto Sans", "Liberation Sans", Arial, sans-serif,
                   "Apple Color Emoji", "Segoe UI Emoji",
                   "Segoe UI Symbol", "Noto Color Emoji";
    }
  </style>
  <!-- 定義: 矢印 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5"
      orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgb(73, 80, 87)"/>
    </marker>
  </defs>

  <!-- 状態 a -->
  <circle cx="0" cy="150" r="30" stroke="rgb(73, 80, 87)" stroke-width="1" fill="white"/>
  <text x="-5" y="156" font-size="16" fill="rgb(73, 80, 87)">a</text>

  <!-- 状態 b -->
  <circle cx="150" cy="50" r="30" stroke="rgb(73, 80, 87)" stroke-width="1" fill="white"/>
  <text x="145" y="56" font-size="16" fill="rgb(73, 80, 87)">b</text>

  <!-- 状態 c -->
  <circle cx="150" cy="250" r="30" stroke="rgb(73, 80, 87)" stroke-width="1" fill="white"/>
  <text x="145" y="256" font-size="16" fill="rgb(73, 80, 87)">c</text>

  <!-- 状態 d -->
  <circle cx="300" cy="150" r="30" stroke="rgb(73, 80, 87)" stroke-width="1" fill="white"/>
  <text x="295" y="156" font-size="16" fill="rgb(73, 80, 87)">d</text>

  <!-- a のループ遷移 -->
  <path d="M -35 160 Q -55 160 -55 150 Q -55 140 -35 140" stroke="rgb(73, 80, 87)" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <text x="-70" y="155" font-size="14" fill="rgb(73, 80, 87)">0</text>

  <!-- a から b への遷移 -->
  <line x1="25" y1="125" x2="130" y2="75" stroke="rgb(73, 80, 87)" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="65" y="95" font-size="14" fill="rgb(73, 80, 87)">1</text>

  <!-- b から d への遷移 -->
  <line x1="170" y1="75" x2="280" y2="125" stroke="rgb(73, 80, 87)" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="230" y="95" font-size="14" fill="rgb(73, 80, 87)">1</text>

  <!-- c から a への遷移 -->
  <line x1="130" y1="225" x2="20" y2="175" stroke="rgb(73, 80, 87)" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="65" y="217" font-size="14" fill="rgb(73, 80, 87)">0</text>

  <!-- c から b への遷移 -->
  <path d="M 140 220 Q 120 150 140 80" stroke="rgb(73, 80, 87)" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <text x="115" y="155" font-size="14" fill="rgb(73, 80, 87)">1</text>

  <!-- b から c への遷移 -->
  <path d="M 160 80 Q 180 150 160 220" stroke="rgb(73, 80, 87)" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <text x="177" y="155" font-size="14" fill="rgb(73, 80, 87)">0</text>

  <!-- d から c への遷移 -->
  <line x1="280" y1="175" x2="170" y2="225" stroke="rgb(73, 80, 87)" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="230" y="217" font-size="14" fill="rgb(73, 80, 87)">0</text>

  <!-- d のループ遷移 -->
  <path d="M 335 160 Q 355 160 355 150 Q 355 140 335 140" stroke="rgb(73, 80, 87)" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <text x="362" y="155" font-size="14" fill="rgb(73, 80, 87)">1</text>
</svg>
