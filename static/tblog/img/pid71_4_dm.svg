<svg color="#ffffff" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 420" role="img" aria-labelledby="title desc">
  <title id="title">シーザー暗号の3文字シフト</title>
  <desc id="desc">アルファベットを3文字ずらして平文を暗号文に置き換える仕組みを示す図。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 24 14" markerWidth="24" markerHeight="14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L24 7 L0 14 Z" fill="#ffffff" />
    </marker>
  </defs>
  <rect x="1" y="1" width="586" height="418" rx="18" fill="none" stroke="#ffffff" stroke-width="1" />
  <text x="294" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#ffffff">シーザー暗号: 鍵 3 で文字をずらす</text>
  <text x="294" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">A → D、B → E、C → F のように、同じ数だけ後ろへ進める</text>

  <g transform="translate(-30 0)">
  <g font-family="monospace" font-size="23" font-weight="700" text-anchor="middle" fill="#ffffff" stroke="#ffffff">
    <rect x="50" y="118" width="48" height="48" rx="6" fill="none" /><text x="74" y="150" stroke="none">A</text>
    <rect x="110" y="118" width="48" height="48" rx="6" fill="none" /><text x="134" y="150" stroke="none">B</text>
    <rect x="170" y="118" width="48" height="48" rx="6" fill="none" /><text x="194" y="150" stroke="none">C</text>
    <rect x="230" y="118" width="48" height="48" rx="6" fill="none" stroke-width="3" /><text x="254" y="150" stroke="none">D</text>
    <rect x="290" y="118" width="48" height="48" rx="6" fill="none" stroke-width="3" /><text x="314" y="150" stroke="none">E</text>
    <rect x="350" y="118" width="48" height="48" rx="6" fill="none" stroke-width="3" /><text x="374" y="150" stroke="none">F</text>
    <rect x="410" y="118" width="48" height="48" rx="6" fill="none" /><text x="434" y="150" stroke="none">G</text>
    <rect x="470" y="118" width="48" height="48" rx="6" fill="none" /><text x="494" y="150" stroke="none">H</text>
    <rect x="530" y="118" width="48" height="48" rx="6" fill="none" /><text x="554" y="150" stroke="none">I</text>
  </g>

  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)">
    <path d="M74 178 C105 226 218 223 242 187" />
    <path d="M134 178 C165 226 278 223 302 187" />
    <path d="M194 178 C225 226 338 223 362 187" />
  </g>
  <text x="224" y="246" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#ffffff">+3</text>

  <rect x="50" y="284" width="528" height="86" rx="10" fill="none" stroke="#ffffff" />
  <text x="314" y="314" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffffff">暗号化の例</text>
  <g font-family="monospace" font-size="24" font-weight="700" text-anchor="middle" fill="#ffffff">
    <text x="178" y="350">H E L L O</text>
    <line x1="284" y1="343" x2="344" y2="343" stroke="#ffffff" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)" />
    <text x="462" y="350">K H O O R</text>
  </g>
  <text x="314" y="394" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">復号では逆に 3 文字前へ戻す。</text>
  </g>
</svg>
