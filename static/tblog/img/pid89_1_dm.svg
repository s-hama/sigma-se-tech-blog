<svg color="#ffffff" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="52 0 738 415" role="img" aria-labelledby="title desc">
  <title id="title">直径1の円と円周の長さ3.141592…</title>
  <desc id="desc">直径1の円周を切り開いて長さを変えずに伸ばすと、長さは3.141592…となる。円と下の目盛りは同じ縮尺で、直径1は180、円周は約565.487の描画単位に対応する。円周は直径を3個並べた長さより約0.14個分長い。図は長さの関係を表し、小数の値の計算は本文の正多角形の説明で行う。</desc>
