  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="butt" marker-end="url(#arrow)">
    <line x1="372" y1="258" x2="416" y2="258" />
  </g>

  <g fill="none" stroke="#ffffff">
    <rect x="460" y="108" width="200" height="56" rx="9" />
    <rect x="460" y="228" width="200" height="56" rx="9" />
    <rect x="460" y="348" width="200" height="56" rx="9" />
  </g>

  <g font-family="sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="560" y="130" font-size="16" font-weight="700">基準位置で読む</text>
    <text x="560" y="155" font-family="monospace" font-size="19" font-weight="700">A → d</text>

    <text x="560" y="250" font-size="16" font-weight="700">内側リングを回す</text>
    <text x="560" y="275" font-family="monospace" font-size="19" font-weight="700">A → q</text>

    <text x="560" y="370" font-size="16" font-weight="700">さらに回す</text>
    <text x="560" y="395" font-family="monospace" font-size="19" font-weight="700">A → m</text>
  </g>

  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="butt" marker-end="url(#arrow)">
    <line x1="560" y1="173" x2="560" y2="196" />
    <line x1="560" y1="294" x2="560" y2="316" />
  </g>
