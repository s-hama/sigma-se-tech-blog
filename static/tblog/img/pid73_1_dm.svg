<svg color="#ffffff" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 444" role="img" aria-labelledby="title desc">
  <title id="title">アルベルティの暗号円盤の仕組み</title>
  <desc id="desc">外側の平文リングと内側の暗号文リングを回し、上の基準位置で対応する文字を読む図。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 24 14" markerWidth="24" markerHeight="14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L24 7 L0 14 Z" fill="#ffffff" />
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="442" rx="18" fill="none" stroke="#ffffff" stroke-width="1" />
  <text x="340" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff">アルベルティの暗号円盤: 基準位置で対応を読む</text>

  <g transform="translate(186 258)">
