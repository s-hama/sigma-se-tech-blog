    <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-182" x2="0" y2="-74" />
      <path d="M-12 -172 L0 -186 L12 -172" />
    </g>

    <g font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
      <text x="0" y="-52">基準位置</text>
      <text x="0" y="-10">外側: 平文</text>
      <text x="0" y="10">内側: 暗号文</text>
    </g>
