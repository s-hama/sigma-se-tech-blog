      <text transform="rotate(96.9) translate(0 -149)">H</text>
      <text transform="rotate(110.8) translate(0 -149)">I</text>
      <text transform="rotate(124.6) translate(0 -149)">J</text>
      <text transform="rotate(138.5) translate(0 -149)">K</text>
      <text transform="rotate(152.3) translate(0 -149)">L</text>
      <text transform="rotate(166.2) translate(0 -149)">M</text>
      <text transform="rotate(180) translate(0 -149)">N</text>
      <text transform="rotate(193.8) translate(0 -149)">O</text>
      <text transform="rotate(207.7) translate(0 -149)">P</text>
      <text transform="rotate(221.5) translate(0 -149)">Q</text>
      <text transform="rotate(235.4) translate(0 -149)">R</text>
      <text transform="rotate(249.2) translate(0 -149)">S</text>
      <text transform="rotate(263.1) translate(0 -149)">T</text>
      <text transform="rotate(276.9) translate(0 -149)">U</text>
      <text transform="rotate(290.8) translate(0 -149)">V</text>
      <text transform="rotate(304.6) translate(0 -149)">W</text>
      <text transform="rotate(318.5) translate(0 -149)">X</text>
      <text transform="rotate(332.3) translate(0 -149)">Y</text>
      <text transform="rotate(346.2) translate(0 -149)">Z</text>
