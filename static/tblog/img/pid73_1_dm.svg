      <circle cx="0" cy="0" r="135" stroke-width="2" />
      <circle cx="0" cy="0" r="102" stroke-width="2" />
    </g>

    <g font-family="monospace" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
