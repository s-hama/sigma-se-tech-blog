      <text transform="rotate(13.8) translate(0 -118)">e</text>
      <text transform="rotate(27.7) translate(0 -118)">f</text>
      <text transform="rotate(41.5) translate(0 -118)">g</text>
      <text transform="rotate(55.4) translate(0 -118)">h</text>
      <text transform="rotate(69.2) translate(0 -118)">i</text>
