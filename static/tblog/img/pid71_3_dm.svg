<svg color="#ffffff" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 858 440" role="img" aria-labelledby="title desc">
  <title id="title">スキュタレー暗号の仕組み</title>
  <desc id="desc">棒に革紐を巻いて文字を書き、外すと順番が崩れ、同じ太さの棒で戻せることを示す図。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 24 14" markerWidth="24" markerHeight="14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L24 7 L0 14 Z" fill="#ffffff" />
    </marker>
  </defs>
  <rect x="1" y="1" width="856" height="438" rx="18" fill="none" stroke="#ffffff" stroke-width="1" />
  <text x="429" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#ffffff">スキュタレー暗号: 巻く太さが鍵になる</text>

  <text x="135" y="84" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffffff">1. 棒に革紐を巻いて書く</text>
  <g fill="none" stroke="#ffffff" stroke-width="2">
    <ellipse cx="135" cy="115" rx="76" ry="18" />
    <line x1="59" y1="115" x2="59" y2="304" />
    <line x1="211" y1="115" x2="211" y2="304" />
    <path d="M59 304 A76 18 0 0 0 211 304" />
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round">
    <path d="M63 156 C103 172 167 172 207 156" />
    <path d="M63 216 C103 232 167 232 207 216" />
    <path d="M63 276 C103 292 167 292 207 276" />
  </g>
  <g font-family="monospace" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">
    <text x="85" y="168">A</text><text x="119" y="174">T</text><text x="153" y="174">T</text><text x="185" y="168">A</text>
    <text x="85" y="228">C</text><text x="119" y="233">K</text><text x="153" y="233">A</text><text x="185" y="228">T</text>
    <text x="85" y="287">D</text><text x="119" y="293">A</text><text x="153" y="293">W</text><text x="185" y="287">N</text>
  </g>

  <line x1="226" y1="198" x2="246" y2="198" stroke="#ffffff" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)" />

  <text x="429" y="84" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffffff">2. 外すと文字順が崩れる</text>
  <path d="M284 158 C330 120 378 214 427 166 C474 121 517 215 576 164" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <path d="M284 186 C330 148 378 242 427 194 C474 149 517 243 576 192" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <g font-family="monospace" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="302" y="171">A</text><text x="333" y="176">C</text><text x="366" y="191">D</text>
    <text x="398" y="201">T</text><text x="430" y="185">K</text><text x="461" y="175">A</text>
    <text x="495" y="189">T</text><text x="528" y="199">A</text><text x="562" y="194">W</text>
  </g>
  <text x="429" y="254" text-anchor="middle" font-family="monospace" font-size="21" font-weight="700" fill="#ffffff">ACDTKATAWATN</text>
  <text x="429" y="282" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">縦方向に読むと暗号文になる</text>

  <line x1="590" y1="198" x2="610" y2="198" stroke="#ffffff" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)" />

  <text x="723" y="84" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffffff">3. 同じ棒で戻す</text>
  <g fill="none" stroke="#ffffff" stroke-width="2">
    <ellipse cx="723" cy="115" rx="76" ry="18" />
    <line x1="647" y1="115" x2="647" y2="304" />
    <line x1="799" y1="115" x2="799" y2="304" />
    <path d="M647 304 A76 18 0 0 0 799 304" />
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round">
    <path d="M651 156 C691 172 755 172 795 156" />
    <path d="M651 216 C691 232 755 232 795 216" />
    <path d="M651 276 C691 292 755 292 795 276" />
  </g>
  <g font-family="monospace" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">
    <text x="673" y="168">A</text><text x="707" y="174">T</text><text x="741" y="174">T</text><text x="773" y="168">A</text>
    <text x="673" y="228">C</text><text x="707" y="233">K</text><text x="741" y="233">A</text><text x="773" y="228">T</text>
    <text x="673" y="287">D</text><text x="707" y="293">A</text><text x="741" y="293">W</text><text x="773" y="287">N</text>
  </g>

  <rect x="20" y="342" width="818" height="78" rx="10" fill="none" stroke="#ffffff" />
  <text x="429" y="376" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffffff">鍵 = 棒の太さ、革紐の巻き方、表の幅</text>
  <text x="429" y="402" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">同じ条件で巻き直せる人だけが、元の文字順を復元できる。</text>
</svg>
