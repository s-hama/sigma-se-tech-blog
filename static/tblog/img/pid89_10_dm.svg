  <title id="title">弧の中点を加えると辺の数が倍になる</title>
  <desc id="desc">内接正多角形の一辺ABに対応する弧の中点Pを加える。元の一辺の代わりにAPとPBの二辺ができ、全体の辺の数が倍になる。</desc>
