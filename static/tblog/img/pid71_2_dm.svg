<svg color="#ffffff" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 400" role="img" aria-labelledby="title desc">
  <title id="title">転置式暗号と換字式暗号の違い</title>
  <desc id="desc">転置式暗号は文字の順番を入れ替え、換字式暗号は文字そのものを置き換えることを示す図。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 24 14" markerWidth="24" markerHeight="14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L24 7 L0 14 Z" fill="#ffffff" />
    </marker>
  </defs>
  <rect x="1" y="1" width="862" height="398" rx="18" fill="none" stroke="#ffffff" stroke-width="1" />
  <text x="432" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff">古典暗号の大きな分類</text>

  <g transform="translate(-28 0)">
  <rect x="48" y="72" width="392" height="286" rx="12" fill="none" stroke="#ffffff" />
  <text x="244" y="112" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#ffffff">転置式暗号</text>
  <text x="244" y="142" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">文字は変えず、順番だけを入れ替える</text>

  <g font-family="monospace" font-size="26" font-weight="700" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="2">
    <rect x="102" y="180" width="48" height="48" rx="6" fill="none" /><text x="126" y="212" stroke="none">H</text>
    <rect x="158" y="180" width="48" height="48" rx="6" fill="none" /><text x="182" y="212" stroke="none">E</text>
    <rect x="214" y="180" width="48" height="48" rx="6" fill="none" /><text x="238" y="212" stroke="none">L</text>
    <rect x="270" y="180" width="48" height="48" rx="6" fill="none" /><text x="294" y="212" stroke="none">L</text>
    <rect x="326" y="180" width="48" height="48" rx="6" fill="none" /><text x="350" y="212" stroke="none">O</text>
    <rect x="102" y="287" width="48" height="48" rx="6" fill="none" stroke-dasharray="6 5" /><text x="126" y="319" stroke="none">L</text>
    <rect x="158" y="287" width="48" height="48" rx="6" fill="none" stroke-dasharray="6 5" /><text x="182" y="319" stroke="none">O</text>
    <rect x="214" y="287" width="48" height="48" rx="6" fill="none" stroke-dasharray="6 5" /><text x="238" y="319" stroke="none">H</text>
    <rect x="270" y="287" width="48" height="48" rx="6" fill="none" stroke-dasharray="6 5" /><text x="294" y="319" stroke="none">E</text>
    <rect x="326" y="287" width="48" height="48" rx="6" fill="none" stroke-dasharray="6 5" /><text x="350" y="319" stroke="none">L</text>
  </g>
  <line x1="244" y1="236" x2="244" y2="255" stroke="#ffffff" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)" />

  <rect x="480" y="72" width="392" height="286" rx="12" fill="none" stroke="#ffffff" />
  <text x="676" y="112" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#ffffff">換字式暗号</text>
  <text x="676" y="142" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">順番は保ち、文字そのものを置き換える</text>

  <g font-family="monospace" font-size="26" font-weight="700" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="2">
    <rect x="534" y="180" width="48" height="48" rx="6" fill="none" /><text x="558" y="212" stroke="none">H</text>
    <rect x="590" y="180" width="48" height="48" rx="6" fill="none" /><text x="614" y="212" stroke="none">E</text>
    <rect x="646" y="180" width="48" height="48" rx="6" fill="none" /><text x="670" y="212" stroke="none">L</text>
    <rect x="702" y="180" width="48" height="48" rx="6" fill="none" /><text x="726" y="212" stroke="none">L</text>
    <rect x="758" y="180" width="48" height="48" rx="6" fill="none" /><text x="782" y="212" stroke="none">O</text>
    <rect x="534" y="287" width="48" height="48" rx="6" fill="none" stroke-dasharray="6 5" /><text x="558" y="319" stroke="none">K</text>
    <rect x="590" y="287" width="48" height="48" rx="6" fill="none" stroke-dasharray="6 5" /><text x="614" y="319" stroke="none">H</text>
    <rect x="646" y="287" width="48" height="48" rx="6" fill="none" stroke-dasharray="6 5" /><text x="670" y="319" stroke="none">O</text>
    <rect x="702" y="287" width="48" height="48" rx="6" fill="none" stroke-dasharray="6 5" /><text x="726" y="319" stroke="none">O</text>
    <rect x="758" y="287" width="48" height="48" rx="6" fill="none" stroke-dasharray="6 5" /><text x="782" y="319" stroke="none">R</text>
  </g>
  <line x1="676" y1="236" x2="676" y2="255" stroke="#ffffff" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)" />

  <text x="244" y="380" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">例: スキュタレー暗号</text>
  <text x="676" y="380" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">例: シーザー暗号</text>
  </g>
</svg>
