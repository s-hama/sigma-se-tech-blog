<svg color="#ffffff" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 293" role="img" aria-labelledby="title desc">
  <title id="title">バーナム暗号とワンタイムパッドの考え方</title>
  <desc id="desc">平文の信号と鍵の信号を組み合わせて暗号文を作り、ワンタイムパッドでは鍵の条件が重要になることを示す図。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 24 14" markerWidth="24" markerHeight="14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L24 7 L0 14 Z" fill="#ffffff" />
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="291" rx="18" fill="none" stroke="#ffffff" stroke-width="1" />
  <text x="340" y="42" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#ffffff">バーナム暗号: 信号に鍵を重ねる</text>

  <g font-family="sans-serif" font-size="17" fill="#ffffff" text-anchor="end">
    <text x="70" y="94">平文</text>
    <text x="70" y="140">鍵</text>
    <text x="70" y="218">暗号文</text>
  </g>
  <g fill="none" stroke="#ffffff">
    <rect x="82" y="70" width="190" height="38" rx="8" />
    <rect x="82" y="116" width="190" height="38" rx="8" />
    <rect x="82" y="194" width="190" height="38" rx="8" />
  </g>
  <g font-family="monospace" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="177" y="98">1 0 1 1 0</text>
    <text x="177" y="144">0 1 1 0 1</text>
    <text x="177" y="222">1 1 0 1 1</text>
  </g>
  <g font-family="serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="176" y="181">P<tspan baseline-shift="sub" font-size="15">i</tspan> ⊕ K<tspan baseline-shift="sub" font-size="15">i</tspan> = C<tspan baseline-shift="sub" font-size="15">i</tspan></text>
  </g>

  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="butt" marker-end="url(#arrow)">
    <line x1="288" y1="155" x2="354" y2="155" />
  </g>

  <g fill="none" stroke="#ffffff">
    <rect x="390" y="70" width="270" height="168" rx="10" />
    <path d="M390 112 H660" />
    <path d="M390 154 H660" />
    <path d="M390 196 H660" />
  </g>
  <g font-family="sans-serif" fill="#ffffff">
    <text x="525" y="98" text-anchor="middle" font-size="18" font-weight="700">ワンタイムパッドの条件</text>
    <text x="428" y="138" font-size="16">鍵はメッセージと同じ長さ</text>
    <text x="428" y="180" font-size="16">鍵は完全にランダム</text>
    <text x="428" y="222" font-size="16">鍵は一度だけ使う</text>
  </g>
  <text x="340" y="272" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">強さは数式だけでなく、鍵の作り方と運用条件で決まる</text>
</svg>
