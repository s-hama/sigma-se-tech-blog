<svg color="#ffffff" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="55.5 19.5 787 406" role="img" aria-labelledby="title desc">
  <title id="title">SIGABAの文字変換とローター制御</title>
  <desc id="desc">SIGABAの文字変換ローター群と、ローターの進み方を決める制御側の関係を示す簡略図。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 24 14" markerWidth="24" markerHeight="14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L24 7 L0 14 Z" fill="#ffffff" />
    </marker>
  </defs>

  <rect x="56" y="20" width="786" height="405" rx="18" fill="none" stroke="#ffffff" stroke-width="1" />
  <text x="450" y="64" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff">SIGABA: 文字変換とローター制御</text>

  <g fill="none" stroke="#ffffff">
    <rect x="85" y="87" width="730" height="154" rx="18" />
    <rect x="85" y="275" width="730" height="126" rx="18" />
  </g>

  <g font-family="sans-serif" fill="#ffffff">
    <text x="98" y="115" font-size="16" font-weight="700">文字変換</text>
    <text x="98" y="303" font-size="16" font-weight="700">ローター制御</text>
  </g>

  <g fill="none" stroke="#ffffff">
    <rect x="124" y="143" width="110" height="62" rx="10" />
    <rect x="334" y="111" width="232" height="108" rx="14" />
    <rect x="666" y="143" width="110" height="62" rx="10" />
  </g>

  <g font-family="sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="179" y="172" font-size="15" font-weight="700">入力文字</text>
    <text x="179" y="192" font-family="monospace" font-size="18" font-weight="700">A</text>
    <text x="721" y="172" font-size="15" font-weight="700">暗号文字</text>
    <text x="721" y="192" font-family="monospace" font-size="18" font-weight="700">K</text>
    <text x="450" y="137" font-size="15" font-weight="700">文字を変換するローター群</text>
  </g>

  <g fill="none" stroke="#ffffff">
    <circle cx="386" cy="179" r="26" />
    <circle cx="450" cy="179" r="26" />
    <circle cx="514" cy="179" r="26" />
  </g>
  <g font-family="sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="386" y="177" font-size="13" font-weight="700">変換</text>
    <text x="386" y="195" font-family="monospace" font-size="18" font-weight="700">I</text>
    <text x="450" y="177" font-size="13" font-weight="700">変換</text>
    <text x="450" y="195" font-family="monospace" font-size="18" font-weight="700">II</text>
    <text x="514" y="177" font-size="13" font-weight="700">変換</text>
    <text x="514" y="195" font-family="monospace" font-size="18" font-weight="700">III</text>
  </g>

  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="butt" marker-end="url(#arrow)">
    <path d="M240 175 H306" />
    <path d="M574 175 H638" />
  </g>

  <g font-family="sans-serif" font-size="13" fill="#ffffff" font-weight="700">
    <text x="274" y="165">入力</text>
    <text x="604" y="165">出力</text>
  </g>

  <g fill="none" stroke="#ffffff">
    <rect x="168" y="325" width="220" height="56" rx="10" />
    <rect x="512" y="325" width="220" height="56" rx="10" />
  </g>

  <g font-family="sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="278" y="351" font-size="15" font-weight="700">制御ローター群</text>
    <text x="278" y="367" font-size="13">次に進む候補を作る</text>
    <text x="622" y="351" font-size="15" font-weight="700">選別ローター群</text>
    <text x="622" y="367" font-size="13">実際に進むローターを決める</text>
  </g>

  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="butt" marker-end="url(#arrow)">
    <path d="M394 355 H484" />
    <path d="M624 321 A180 180 0 0 0 554 215" />
    <path d="M276 321 A180 180 0 0 1 346 215" />
  </g>

  <g font-family="sans-serif" font-size="13" fill="#ffffff" font-weight="700">
    <text x="440" y="347">候補</text>
    <text x="214" y="263">進み方を制御</text>
    <text x="608" y="263">進めるローターを指定</text>
  </g>
</svg>
