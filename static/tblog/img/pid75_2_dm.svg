<svg color="#ffffff" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 323" role="img" aria-labelledby="title desc">
  <title id="title">ADFGVX暗号の二段階変換</title>
  <desc id="desc">平文をADFGVXの文字組に置き換え、転置鍵の列順で読み出して暗号文にする流れ。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 24 14" markerWidth="24" markerHeight="14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L24 7 L0 14 Z" fill="#ffffff" />
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="322" rx="18" fill="none" stroke="#ffffff" stroke-width="1" />
  <text x="430" y="45" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff">ADFGVX暗号: 換字してから並べ替える</text>

  <g fill="none" stroke="#ffffff">
    <rect x="20" y="75" width="110" height="184" rx="10" />
    <rect x="180" y="75" width="250" height="184" rx="10" />
    <rect x="480" y="75" width="130" height="184" rx="10" />
    <rect x="660" y="75" width="180" height="184" rx="10" />
  </g>

  <g font-family="sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="73" y="144" font-size="20" font-weight="700">1. 平文</text>
    <text x="305" y="144" font-size="20" font-weight="700">2. 換字</text>
    <text x="546" y="144" font-size="20" font-weight="700">3. 転置鍵</text>
    <text x="748" y="144" font-size="20" font-weight="700">4. 暗号文</text>
  </g>

  <g font-family="monospace" fill="#ffffff" text-anchor="middle">
    <text x="75" y="174" font-size="22" font-weight="700">ATTACK</text>
    <text x="305" y="174" font-size="22" font-weight="700">AA GD GD AA AF DV</text>
    <text x="265" y="201" font-size="20">A,D,F,G,V,X</text>
    <text x="365" y="200" font-size="16">の組にする</text>
    <text x="546" y="174" font-size="22" font-weight="700">KEY</text>
    <text x="516" y="200" font-size="16">列順</text>
    <text x="566" y="201" font-size="20">E,K,Y</text>
    <text x="751" y="174" font-size="22" font-weight="700">AGADAD</text>
    <text x="750" y="204" font-size="22" font-weight="700">AFGDAV</text>
  </g>

  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="butt" marker-end="url(#arrow)">
    <line x1="136" y1="167" x2="151" y2="167" />
    <line x1="436" y1="167" x2="451" y2="167" />
    <line x1="616" y1="167" x2="631" y2="167" />
  </g>

  <text x="430" y="298" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">換字で文字を別の組に変え、転置で並び順を崩す</text>
</svg>
