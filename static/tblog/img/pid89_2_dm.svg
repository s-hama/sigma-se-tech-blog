<svg color="#ffffff" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="25 0 725 656" role="img" aria-labelledby="title desc">
  <title id="title">円周を内接・外接正多角形で挟む</title>
  <desc id="desc">左上は正六角形、右上は正十二角形。細い実線は内接多角形、太い実線は円、破線は外接多角形を表す。下段では正十二角形の下側を縦横とも同じ倍率で拡大し、内接正十二角形の辺、円弧、外接正十二角形の辺を見分けられるようにしている。内接正十二角形の頂点と外接正十二角形の辺は、それぞれ異なる位置で円周に接している。</desc>
