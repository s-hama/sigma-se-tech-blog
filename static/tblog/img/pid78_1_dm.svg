<svg color="#ffffff" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="34 0 752 332" role="img" aria-labelledby="title desc">
  <title id="title">Diffie-Hellman鍵交換の基本構造</title>
  <desc id="desc">送信者と受信者が秘密値を送らず、公開値だけを交換し、手元で同じ共有秘密を作る流れ。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 16 10" markerWidth="16" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L16 5 L0 10 Z" fill="#ffffff" />
    </marker>
  </defs>

  <rect x="34.5" y="0.5" width="751" height="329" rx="16" fill="none" stroke="#ffffff" stroke-width="1" />
  <text x="410" y="38" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#ffffff">Diffie-Hellman: 共有秘密を直接送らない</text>

  <g fill="none" stroke="#ffffff">
    <rect x="56" y="58" width="202" height="78" rx="8" />
    <rect x="562" y="58" width="202" height="78" rx="8" />
    <rect x="306" y="56" width="208" height="36" rx="8" />
    <rect x="306" y="108" width="208" height="36" rx="8" />
    <rect x="56" y="218" width="202" height="62" rx="8" />
    <rect x="562" y="218" width="202" height="62" rx="8" />
  </g>

  <g font-family="sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="157" y="91" font-size="16" font-weight="700">送信者</text>
    <text x="157" y="113" font-size="15">秘密値 a は送らない</text>
    <text x="663" y="91" font-size="16" font-weight="700">受信者</text>
    <text x="663" y="113" font-size="15">秘密値 b は送らない</text>

    <text x="410" y="80" font-size="15" font-weight="700">公開値 A を送る</text>
    <text x="410" y="132" font-size="15" font-weight="700">公開値 B を返す</text>
    <text x="410" y="180" font-size="15" font-weight="700">相手の公開値 + 自分の秘密値</text>
    <text x="410" y="202" font-size="14">通信路に流れるのは公開値だけ</text>

    <text x="157" y="245" font-size="15" font-weight="700">送信者側で計算</text>
    <text x="157" y="267" font-family="monospace" font-size="18" font-weight="700">S</text>
    <text x="663" y="245" font-size="15" font-weight="700">受信者側で計算</text>
    <text x="663" y="267" font-family="monospace" font-size="18" font-weight="700">S</text>
    <text x="410" y="311" font-size="15" font-weight="700">同じ共有秘密 S ができるが、S そのものは送らない</text>
  </g>

  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M264 74 H286" />
    <path d="M520 74 H542" />
    <path d="M556 126 H534" />
    <path d="M300 126 H278" />
    <path d="M157 142 V198" />
    <path d="M663 142 V198" />
  </g>
</svg>
