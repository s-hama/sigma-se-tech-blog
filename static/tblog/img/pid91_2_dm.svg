<svg color="#ffffff" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="title desc">
  <title id="title">円の大きさが違っても同じ幅の隙間ができる</title>
  <desc id="desc">小さい円と大きい円をそれぞれ同心円として広げる。どちらも円周を同じ長さLだけ増やすと隙間はh=L/(2π)となる。図中の隙間は同じ幅で描いているが、本文の半径1m対100mの縮尺ではない。</desc>
  <defs>
    <marker id="dimension" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <style>
    .math { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; }
    .var { font-style: italic; }
  </style>
  <rect x="1" y="1" width="818" height="468" rx="18" fill="none" stroke="#ffffff" stroke-width="1"/>
  <g font-family="sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="410" y="40" font-size="23" font-weight="700">同じ長さを足すと隙間も同じになる</text>
    <text x="195" y="82" font-size="21" font-weight="700">小さい円</text>
    <text x="595" y="82" font-size="21" font-weight="700">大きい円</text>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <circle cx="195" cy="242" r="58"/>
    <circle cx="195" cy="242" r="88" stroke-dasharray="8 6"/>
    <circle cx="595" cy="242" r="118"/>
    <circle cx="595" cy="242" r="148" stroke-dasharray="8 6"/>
  </g>
  <g fill="#ffffff">
    <circle cx="195" cy="242" r="3"/>
    <circle cx="595" cy="242" r="3"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="1.5" marker-start="url(#dimension)" marker-end="url(#dimension)">
    <line x1="258" y1="242" x2="278" y2="242"/>
    <line x1="718" y1="242" x2="738" y2="242"/>
  </g>
  <g class="math var" fill="#ffffff" font-size="26" text-anchor="middle">
    <text x="267" y="269" font-size="22">h</text>
    <text x="727" y="269" font-size="22">h</text>
  </g>
  <g font-family="sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="195" y="367" font-size="21">円周に同じ長さ L を足す</text>
    <text x="410" y="418" font-size="21" font-weight="700">どちらも h = L ÷ (2π)</text>
    <text x="410" y="447" font-size="18">実線：元の円　破線：広げた後のひも（模式図）</text>
  </g>
</svg>
